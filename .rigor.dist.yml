# Rigor static checker (GH #171). Runs next to Steep, not instead of it.
# A per-dev .rigor.yml replaces this file entirely; use `includes: [.rigor.dist.yml]` to layer.
target_ruby: "4.0"
paths: [app, lib]
exclude: ["vendor/**", "tmp/**"]
signature_paths: [sig]
rbs_collection: { lockfile: rbs_collection.lock.yaml }
baseline: .rigor-baseline.yml
plugins:
  - rigor-railties
  - gem: rigor-activerecord
    config:
      schema_file: tmp/rigor/schema.rb          # generated by script/rigor_schema.rb
      structure_sql_file: tmp/rigor/absent.sql  # never parse the SQLite dump; missing schema = reduced mode
  - rigor-actionpack
  - rigor-rails-routes
  - rigor-actionmailer
  - rigor-activejob
