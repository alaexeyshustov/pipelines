name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    name: JS Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: corepack enable pnpm && pnpm install

      - name: Run ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm format:check

      - name: Run Herb linter (HTML+ERB)
        run: pnpm herb:lint

      - name: Run pnpm audit
        run: pnpm audit

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

      - name: Run ArchSpec
        run: bundle exec archspec check --check-todo

      - name: Run Herb analyze (ERB security and compile check)
        run: bundle exec herb analyze .

  steep:
    name: Steep Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install RBS collection
        run: bundle exec rbs collection install

      - name: Validate RBS signatures
        run: bundle exec rbs  -r optparse validate sig/**/*.rbs sig/**/**/*.rbs sig/**/**/**/*.rbs

      - name: Run Steep
        run: bundle exec steep check

      - name: Check type coverage (≥90%)
        run: bundle exec bin/rbs_audit coverage --threshold=90

  rigor:
    name: Rigor Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install RBS collection
        run: bundle exec rbs collection install

      - name: Generate schema for rigor-activerecord
        run: bundle exec ruby script/rigor_schema.rb

      - name: Restore Rigor cache
        uses: actions/cache@v6
        with:
          path: .rigor/cache
          key: rigor-${{ hashFiles('Gemfile.lock') }}-${{ github.sha }}
          restore-keys: rigor-${{ hashFiles('Gemfile.lock') }}-

      - name: Run Rigor
        run: bundle exec rigor check

  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager

      - name: Run bundler-audit
        run: bundle exec bundle-audit check --update

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      COVERAGE: true
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get install -y libsqlite3-dev

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:schema:load

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: corepack enable pnpm && pnpm install

      - name: Build assets
        run: pnpm run build && bundle exec rails tailwindcss:build

      - name: Run RSpec (unit)
        run: bundle exec rspec --tag '~js'

  e2e:
    name: E2E (headless Chrome)
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      CSP_NETWORK_SPECS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get install -y libsqlite3-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:schema:load

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: corepack enable pnpm && pnpm install

      - name: Build assets
        run: pnpm run build && bundle exec rails tailwindcss:build

      - name: Run RSpec (:js system specs)
        run: bundle exec rspec --tag js

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get install -y libsqlite3-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:schema:load

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install

      - name: Build assets
        run: pnpm run build && bundle exec rails tailwindcss:build

      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright (chromium project)
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tmp/playwright/report
          retention-days: 7

  rubycritic:
    name: RubyCritic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RubyCritic
        run: bundle exec rubycritic --no-browser --format console app/ lib/

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get install -y libsqlite3-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:schema:load

      - name: Run mutation testing
        run: |
          bundle exec mutant run --since origin/main --jobs 2 2>&1 | tee mutant_output.txt || true
          score=$(grep "Coverage:" mutant_output.txt | grep -v "Line Coverage" | grep -oE '[0-9]+(\.[0-9]+)?%' | tr -d '%')
          echo "Mutation score: ${score}%"
          if [ -z "$score" ]; then
            echo "No changed subjects matched — skipping threshold check"
            exit 0
          fi
          awk -v s="$score" -v t="90.0" \
            'BEGIN { if (s+0 < t+0) { print "::error::Mutation score " s "% is below the 90% minimum threshold"; exit 1 } }'
