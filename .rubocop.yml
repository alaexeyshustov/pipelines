inherit_gem:
  rubocop-rails-omakase: rubocop.yml
require:
  - ./lib/rubocop/cop/app_cops
plugins:
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-on-rbs

AllCops:
  NewCops: enable
  Exclude:
    - ".gem_rbs_collection/**/*"
    - "lib/view_primitives/**/*"
    # Standalone tooling scripts, not app code; the Metrics cops don't suit them.
    - ".sandbox/**/*"
    - "bin/**/*"

Lint:
 Enabled: true
Metrics:
 Enabled: true
Naming:
 Enabled: false
Performance:
 Enabled: true
Rails:
 Enabled: true
Security:
 Enabled: true

Rails/SquishedSQLHeredocs:
 Enabled: false
Rails/NegateInclude:
  Enabled: false
Rails/I18nLocaleTexts:
 Enabled: false
Rails/SkipsModelValidations:
 Enabled: false
Rails/Delegate:
  Enabled: false
Rails/WhereRange:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/ClassLength:
  Enabled: true
  Max: 110
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
Metrics/BlockLength:
  Enabled: true
  Max: 6
  CountAsOne:
  - hash
  AllowedMethods: [ 'describe', 'context', 'schema', 'scope', 'aasm', 'respond_to', 'class_methods' ]
  Exclude:
    - 'Gemfile'
    - 'Steepfile'
    - 'lib/tasks/**/*.rake'
    - 'app/schemas/**/*'
    - 'db/**/*'
    - 'config/**/*'
Metrics/MethodLength:
  Enabled: true
  Max: 10
  CountAsOne:
    - hash
  AllowedMethods:
    - initialize
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
Metrics/AbcSize:
  Enabled: true
  Exclude:
    - 'db/**/*'
    - 'db/*'
    - 'config/**/*'
    - 'config/*'
Metrics/CyclomaticComplexity:
  Enabled: true
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
Metrics/PerceivedComplexity:
  Enabled: true
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
Naming/MethodParameterName:
  Enabled: false
Naming/PredicatePrefix:
  Enabled: false

Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
Lint/MissingSuper:
  Enabled: false
RSpec/MultipleExpectations:
  Max: 3
RSpec/ExampleLength:
  Max: 10
# RubyLLM::Evaluation::RSpec's `evaluates` defines one example per case.
RSpec:
  Language:
    Includes:
      Examples:
        - evaluates
RSpec/MultipleMemoizedHelpers:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

App/ComponentMustHavePreview:
  Exclude:
    - 'app/components/application_component.rb'

# Services that still return raw values or row types; convert them with the result-returning services (GH #230).
App/ServiceMustDefineResult:
  Exclude:
    - 'app/services/document/download.rb'
    - 'app/services/document/search_query.rb'
    - 'app/services/document/text_extractor.rb'
    - 'app/services/email/search_query.rb'
    - 'app/services/emails/retrieval_service.rb'
    - 'app/services/emails/test_connection_service.rb'
    - 'app/services/evaluation/agent_summary_query.rb'
    - 'app/services/evaluation/experiment_usage_query.rb'
    - 'app/services/evaluation/improve_failure_logger.rb'
    - 'app/services/evaluation/metric_pass_rate_query.rb'
    - 'app/services/evaluation/metric_suggester.rb'
    - 'app/services/evaluation/pass_rate_query.rb'
    - 'app/services/evaluation/prompt_creator.rb'
    - 'app/services/evaluation/sampler.rb'
    - 'app/services/gist_uploader.rb'
    - 'app/services/interviews/csv_export_service.rb'
    - 'app/services/tag_pages/search.rb'

# Shims declare shared interfaces and aliases at the top level on purpose.
RBS/Lint/TopLevelInterface:
  Enabled: false
RBS/Lint/TopLevelTypeAlias:
  Enabled: false
